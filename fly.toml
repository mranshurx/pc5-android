app = "pc5-android"
primary_region = "bom"

auto_stop_machines = "off"
auto_start_machines = false
min_machines_running = 1

[build]

[env]
  PORT = "3000"

[[services]]
  internal_port = 3000
  protocol = "tcp"

  [[services.ports]]
    port = 80
    handlers = ["http"]

  [[services.ports]]
    port = 443
    handlers = ["tls", "http"]

[[services]]
  internal_port = 443
  protocol = "udp"

  [[services.ports]]
    port = 443
