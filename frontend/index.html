<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#0a0c10" />
<title>PC5 ANDROID</title>
<link rel="icon" href="logo/favicon.png" />
<style>
  :root{
    --bg:#0a0c10;
    --bg2:#0f131a;
    --card:#12171f;
    --line:#1e2632;
    --fg:#e7edf6;
    --mut:#7d8a9c;
    --accent:#3ea6ff;
    --live:#2fd08a;
    --warn:#f5b642;
    --danger:#ff5f6d;
    --radius:14px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{height:100%}
  body{
    margin:0;background:radial-gradient(1200px 600px at 50% -10%,#131b26 0%,var(--bg) 55%);
    color:var(--fg);font:14px/1.5 ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
    display:flex;flex-direction:column;min-height:100%;
  }
  .wrap{width:100%;max-width:520px;margin:0 auto;padding:18px 16px 28px;flex:1;display:flex;flex-direction:column}
  header{display:flex;align-items:center;gap:12px;padding:6px 0 18px}
  header .brand{display:flex;flex-direction:column;line-height:1.15}
  header .brand b{font-size:15px;letter-spacing:.5px}
  header .brand span{font-size:10px;color:var(--mut);letter-spacing:2px;text-transform:uppercase}
  header .logo{
    width:42px;height:42px;border-radius:12px;flex:0 0 42px;
    background:linear-gradient(140deg,#1c2534,#0d1218);border:1px solid var(--line);
    display:grid;place-items:center;font-weight:800;color:var(--accent);font-size:13px
  }
  header .spacer{flex:1}
  header a.tg{
    font-size:11px;color:var(--mut);text-decoration:none;border:1px solid var(--line);
    padding:7px 10px;border-radius:9px;background:var(--bg2)
  }
  main{flex:1}
  .card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:16px;margin-bottom:14px}
  .hidden{display:none !important}
  h2{margin:0 0 4px;font-size:16px}
  p.sub{margin:0 0 16px;font-size:12px;color:var(--mut)}
  label.form-label{display:block;font-size:10px;letter-spacing:1.4px;text-transform:uppercase;color:var(--mut);margin-bottom:7px}
  input[type=text]{
    width:100%;padding:13px 14px;border-radius:11px;border:1px solid var(--line);
    background:var(--bg2);color:var(--fg);font:600 15px/1 ui-monospace,SFMono-Regular,Menlo,monospace;
    letter-spacing:1.5px;text-transform:uppercase;outline:none
  }
  input[type=text]:focus{border-color:var(--accent)}
  .btn{
    display:block;width:100%;padding:13px;border-radius:11px;border:0;cursor:pointer;
    font:700 13px/1 inherit;letter-spacing:.4px;margin-top:12px;
    background:linear-gradient(180deg,#3ea6ff,#2b86d6);color:#04121f
  }
  .btn:active{transform:translateY(1px)}
  .btn.subtle{background:var(--bg2);color:var(--fg);border:1px solid var(--line)}
  .btn.ghost{background:transparent;border:1px solid var(--line);color:var(--mut)}
  .err{min-height:16px;margin-top:10px;font-size:12px;color:var(--danger)}
  .maint{display:flex;flex-direction:column;align-items:center;text-align:center;padding:34px 18px}
  .maint .ico{font-size:34px;margin-bottom:12px}
  .maint h2{margin-bottom:10px}
  .maint p{margin:0;font-size:13px;color:var(--mut);max-width:300px}
  .stats{display:grid;gap:10px;margin-bottom:14px}
  .stat{display:flex;justify-content:space-between;align-items:center;gap:12px;
    background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 13px}
  .stat .k{font-size:10px;letter-spacing:1.3px;text-transform:uppercase;color:var(--mut)}
  .stat .v{font:600 13px/1.3 ui-monospace,SFMono-Regular,Menlo,monospace;text-align:right;word-break:break-all}
  .v.live{color:var(--live)}
  .v.warn{color:var(--warn)}
  .time-left{font-variant-numeric:tabular-nums;font-size:15px;font-weight:700}
  .tabs{display:flex;gap:8px;margin-bottom:12px}
  .tab{flex:1;padding:9px;border-radius:10px;border:1px solid var(--line);background:var(--bg2);
    color:var(--mut);font:700 11px/1 inherit;letter-spacing:.6px;text-transform:uppercase;cursor:pointer}
  .tab.on{background:#17222f;border-color:#2b4a68;color:var(--fg)}
  .row{display:flex;gap:8px}
  .row .btn{margin-top:0}
  ul.features{list-style:none;margin:12px 0 0;padding:0;display:grid;gap:7px}
  ul.features li{font-size:11.5px;color:var(--mut);display:flex;gap:8px;align-items:flex-start;
    background:var(--bg2);border:1px solid var(--line);border-radius:9px;padding:8px 10px}
  ul.features li::before{content:"✓";color:var(--live);font-weight:800}
  .kv{font-size:12px;color:var(--mut);word-break:break-all;margin:0 0 10px}
  .kv b{color:var(--fg);font-family:ui-monospace,Menlo,monospace}
  #updatesList{list-style:none;margin:0;padding:0;display:grid;gap:8px;max-height:230px;overflow:auto}
  #updatesList li{font-size:12px;color:var(--mut);background:var(--bg2);border:1px solid var(--line);
    border-radius:9px;padding:9px 11px}
  footer{text-align:center;font-size:10px;color:#4a5567;padding-top:16px}
  #toast{
    position:fixed;left:50%;bottom:26px;transform:translate(-50%,20px);opacity:0;pointer-events:none;
    background:#1a2432;border:1px solid #2b3a4d;color:var(--fg);font-size:12px;
    padding:10px 16px;border-radius:10px;transition:.22s;max-width:90vw;text-align:center
  }
  #toast.on{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<div class="wrap">

  <header>
    <div class="logo">PC5</div>
    <div class="brand"><b>PC5 ANDROID</b><span>access portal</span></div>
    <div class="spacer"></div>
    <a class="tg" id="tgLink" href="#" target="_blank" rel="noopener">Telegram</a>
  </header>

  <main>

    <!-- ============ UNLOCK ============ -->
    <section id="unlockView" class="card">
      <h2>Unlock access</h2>
      <p class="sub">Paste your access key to load your profile.</p>
      <label class="form-label" for="keyInput">Access key</label>
      <input type="text" id="keyInput" placeholder="PC5-XXXXXX" autocomplete="off"
             autocapitalize="characters" spellcheck="false" maxlength="12" />
      <button class="btn" id="unlockBtn" type="button">Unlock</button>
      <div class="err" id="errorMsg"></div>
    </section>

    <!-- ============ MAINTENANCE ============ -->
    <section id="maintenanceView" class="card maint hidden">
      <div class="ico">🛠️</div>
      <h2>Under maintenance</h2>
      <p id="maintenanceMsgText">System under maintenance.</p>
      <button class="btn subtle" id="maintRetryBtn" type="button" style="margin-top:18px;max-width:220px">Retry now</button>
    </section>

    <!-- ============ DASHBOARD ============ -->
    <section id="dashboardView" class="hidden">

      <div class="card">
        <div class="stats">
          <div class="stat">
            <span class="k">Access key</span>
            <span class="v" id="displayKey">—</span>
          </div>
          <div class="stat">
            <span class="k">Device</span>
            <span class="v" id="displayDevice">—</span>
          </div>
          <div class="stat">
            <span class="k">Expires</span>
            <span class="v" id="displayExpiry">—</span>
          </div>
          <div class="stat">
            <span class="k">Time left</span>
            <span class="v live time-left" id="displayLeft">—</span>
          </div>
        </div>

        <div class="tabs">
          <button class="tab on" id="tabProxy" type="button">Profile</button>
          <button class="tab" id="tabUpdates" type="button">Updates</button>
          <button class="tab" id="tabInfo" type="button">Info</button>
        </div>

        <div id="proxyTab">
          <button class="btn" id="happBtn" type="button">Open in Happ</button>
          <div class="row" style="margin-top:10px">
            <button class="btn subtle" id="copySubBtn" type="button">Copy sub link</button>
            <button class="btn ghost" id="copyKeyBtn" type="button">Copy key</button>
          </div>
          <ul class="features" id="featureList"></ul>
        </div>

        <div id="updatesTab" class="hidden">
          <ul id="updatesList"><li>Loading…</li></ul>
        </div>

        <div id="infoTab" class="hidden">
          <p class="kv">Device id<br /><b id="displayDeviceFull">—</b></p>
          <p class="kv">Support<br /><b id="displaySupport">—</b></p>
          <div class="row">
            <button class="btn subtle" id="refreshBtn" type="button">Refresh</button>
            <button class="btn ghost" id="logoutBtn" type="button">Sign out</button>
          </div>
        </div>
      </div>

    </section>

  </main>

  <footer>PC5 ANDROID · private build</footer>
</div>

<div id="toast"></div>

<script>
(function () {
  "use strict";

  /* ================= CONFIG ================= */
  /* same service serves the site AND the API — resolve against this origin */
  const BACKEND_URL = location.origin;
  const STORAGE_KEY = "pc5_android_session";
  const DEVICE_KEY  = "pc5_android_device";
  const TELEGRAM_URL = "https://t.me/cyberxsilent";
  const UPDATES_URL = "updates/update.txt";

  /* ================= STATE ================= */
  let rawSubUrl = "";
  let happLink = "";
  let activeKey = "";
  let expiryTimer = null;
  let countdownTimer = null;
  let expiresAtMs = 0;
  let frozenLeftMs = null;
  let updatesLoaded = false;

  /* ================= DEVICE ================= */
  function makeDeviceId() {
    const a = new Uint8Array(8);
    (crypto.getRandomValues ? crypto : { getRandomValues: (x) => { for (let i = 0; i < x.length; i++) x[i] = Math.floor(Math.random() * 256); return x; } }).getRandomValues(a);
    return "D" + Array.prototype.map.call(a, b => b.toString(16).padStart(2, "0")).join("");
  }
  let DEVICE_ID = localStorage.getItem(DEVICE_KEY);
  if (!DEVICE_ID) { DEVICE_ID = makeDeviceId(); localStorage.setItem(DEVICE_KEY, DEVICE_ID); }
  const DEVICE_SHORT = DEVICE_ID.slice(1, 9);

  /* ================= HELPERS ================= */
  const $ = (id) => document.getElementById(id);

  function toast(msg) {
    const el = $("toast");
    if (!el) return;
    el.innerText = msg;
    el.classList.add("on");
    clearTimeout(toast._t);
    toast._t = setTimeout(() => el.classList.remove("on"), 2000);
  }

  function normalizeKey(v) {
    let s = String(v || "").toUpperCase().replace(/[^A-Z0-9]/g, "");
    if (s.startsWith("PC5")) s = s.slice(3);
    return s ? "PC5-" + s.slice(0, 6) : "";
  }

  function maskKey(k) {
    if (!k) return "—";
    return k.slice(0, 4) + "•••" + k.slice(-2);
  }

  async function copyText(text, okMsg) {
    if (!text) return;
    try {
      if (navigator.clipboard && window.isSecureContext) {
        await navigator.clipboard.writeText(text);
      } else {
        const t = document.createElement("textarea");
        t.value = text; t.style.position = "fixed"; t.style.opacity = "0";
        document.body.appendChild(t); t.select(); document.execCommand("copy");
        document.body.removeChild(t);
      }
      toast(okMsg || "Copied");
    } catch (e) { toast("Copy failed"); }
  }

  /* ================= SESSION ================= */
  function saveSession(key, expiresAt) {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify({ key: key, expiresAt: expiresAt || null })); } catch (e) {}
  }
  function readSession() {
    try { return JSON.parse(localStorage.getItem(STORAGE_KEY) || "null"); } catch (e) { return null; }
  }
  function clearSession() {
    try { localStorage.removeItem(STORAGE_KEY); } catch (e) {}
  }

  /* ================= VIEWS ================= */
  function showUnlock() {
    stopCountdown();
    if (expiryTimer) { clearTimeout(expiryTimer); expiryTimer = null; }
    frozenLeftMs = null;
    expiresAtMs = 0;
    activeKey = "";
    $("maintenanceView").classList.add("hidden");
    $("dashboardView").classList.add("hidden");
    $("unlockView").classList.remove("hidden");
  }

  function showMaintenance(msg) {
    $("unlockView").classList.add("hidden");
    $("dashboardView").classList.add("hidden");
    $("maintenanceMsgText").innerText = msg || "System under maintenance.";
    $("maintenanceView").classList.remove("hidden");
  }

  function showDashboard(key, expiresAt, deviceLimit, deviceLocked, pausedRemaining) {
    const changed = (activeKey !== key);
    activeKey = key;
    rawSubUrl = `${BACKEND_URL}/sub?key=${encodeURIComponent(key)}&did=${encodeURIComponent(DEVICE_ID)}`;

    if (changed) { happLink = ""; loadHappLink(key); }

    expiresAtMs = expiresAt ? new Date(expiresAt).getTime() : 0;
    frozenLeftMs = (typeof pausedRemaining === "number") ? pausedRemaining : null;

    const keyEl = $("displayKey");
    keyEl.innerText = maskKey(key);
    keyEl.title = key;

    const devEl = $("displayDevice");
    if (deviceLimit === "single") {
      devEl.innerText = deviceLocked ? `1 device · locked (${DEVICE_SHORT}…)` : `1 device (${DEVICE_SHORT}…)`;
      devEl.className = "v warn";
    } else {
      devEl.innerText = "Unlimited";
      devEl.className = "v live";
    }

    $("displayExpiry").innerText = expiresAt ? new Date(expiresAt).toLocaleString() : "—";
    $("displayDeviceFull").innerText = DEVICE_ID;
    $("maintenanceView").classList.add("hidden");
    $("unlockView").classList.add("hidden");
    $("dashboardView").classList.remove("hidden");

    paintFeatures();
    startCountdown();
    scheduleExpiry(expiresAt);
  }

  function logout() {
    clearSession();
    stopCountdown();
    if (expiryTimer) { clearTimeout(expiryTimer); expiryTimer = null; }
    frozenLeftMs = null;
    expiresAtMs = 0;
    activeKey = "";
    happLink = "";
    rawSubUrl = "";
    showUnlock();
  }

  /* ================= COUNTDOWN ================= */
  function startCountdown() {
    if (countdownTimer) clearInterval(countdownTimer);
    updateLeft();
    countdownTimer = setInterval(updateLeft, 1000);
  }
  function stopCountdown() {
    if (countdownTimer) clearInterval(countdownTimer);
    countdownTimer = null;
  }
  function updateLeft() {
    const el = $("displayLeft");
    if (!el) return;
    if (frozenLeftMs == null && !expiresAtMs) { el.innerText = "—"; return; }
    /* while frozen the remaining value is held constant — nothing drains */
    let ms = frozenLeftMs != null ? frozenLeftMs : (expiresAtMs - Date.now());
    if (ms <= 0) { el.innerText = "EXPIRED"; return; }
    const d = Math.floor(ms / 86400000);
    const h = Math.floor((ms % 86400000) / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);
    const s = Math.floor((ms % 60000) / 1000);
    el.innerText = `${d > 0 ? d + "d " : ""}${h}h ${m}m ${s}s${frozenLeftMs != null ? " · paused" : ""}`;
  }
  function scheduleExpiry(expiresAt) {
    if (expiryTimer) clearTimeout(expiryTimer);
    const ms = frozenLeftMs != null ? frozenLeftMs : (expiresAt ? new Date(expiresAt).getTime() - Date.now() : 0);
    /* revalidate rather than hard logout: a stale local stamp may just be maintenance */
    if (ms <= 0) { revalidate(); return; }
    expiryTimer = setTimeout(revalidate, Math.min(ms, 3600000));
  }

  /* ================= API ================= */
  async function checkKey(key) {
    const res = await fetch(`${BACKEND_URL}/api/check-key?key=${encodeURIComponent(key)}&did=${encodeURIComponent(DEVICE_ID)}`);
    return res.json();
  }
  async function getMaintenance() {
    try { const r = await fetch(`${BACKEND_URL}/api/maintenance-status`); return r.json(); }
    catch (e) { return { enabled: false }; }
  }

  /* ================= MAINTENANCE BRANCH ================= */
  /* Already unlocked? keep the panel and hold the clock. Otherwise show the
     maintenance view. Either way the server hands over a frozen remainingMs. */
  function handleMaintenance(data) {
    frozenLeftMs = (typeof data.remainingMs === "number") ? data.remainingMs : null;
    if (!$("dashboardView").classList.contains("hidden")) {
      updateLeft();
    } else {
      showMaintenance(data.message);
    }
  }

  /* ================= ACTIONS ================= */
  async function unlockPortal() {
    const input = $("keyInput");
    const errorMsg = $("errorMsg");
    errorMsg.innerText = "";

    const key = normalizeKey(input.value);
    input.value = key;
    if (!key) { errorMsg.innerText = "Please enter your access key."; return; }

    try {
      const data = await checkKey(key);
      if (data.maintenance) { handleMaintenance(data); return; }
      if (data.valid) {
        saveSession(data.key, data.expiresAt);
        showDashboard(data.key, data.expiresAt, data.deviceLimit, data.deviceLocked, null);
      } else {
        errorMsg.innerText = data.message || "Invalid key.";
      }
    } catch (err) {
      errorMsg.innerText = "Connection error. Check your server status.";
    }
  }

  async function revalidate() {
    const s = readSession();
    const key = s ? s.key : activeKey;

    if (!key) {
      const m = await getMaintenance();
      if (m && !m.enabled) showUnlock();
      return;
    }
    try {
      const data = await checkKey(key);
      if (data.maintenance) { handleMaintenance(data); return; }
      if (!data.valid) { logout(); return; }
      saveSession(data.key, data.expiresAt);
      showDashboard(data.key, data.expiresAt, data.deviceLimit, data.deviceLocked, null);
    } catch (err) {}
  }

  async function restoreSession() {
    const s = readSession();
    if (!s) return false;
    /* the local stamp is not trusted — a frozen key legitimately sits in the
       past during maintenance, so the server decides */
    try {
      const data = await checkKey(s.key);
      if (data.maintenance) { handleMaintenance(data); return true; }
      if (data.valid) {
        saveSession(data.key, data.expiresAt);
        showDashboard(data.key, data.expiresAt, data.deviceLimit, data.deviceLocked, null);
        return true;
      }
      clearSession();
      return false;
    } catch (err) {
      showDashboard(s.key, s.expiresAt, "unlimited", false, null);
      return true;
    }
  }

  async function loadHappLink(key) {
    try {
      const r = await fetch(`${BACKEND_URL}/api/happ-link?key=${encodeURIComponent(key)}&did=${encodeURIComponent(DEVICE_ID)}`);
      const d = await r.json();
      if (d && d.ok && d.link) {
        happLink = d.link;
        $("happBtn").innerText = "Open in Happ";
        $("happBtn").disabled = false;
      } else {
        happLink = "";
        $("happBtn").innerText = d && d.message ? d.message : "Happ link unavailable";
        $("happBtn").disabled = true;
      }
    } catch (e) {
      happLink = "";
      $("happBtn").innerText = "Happ link unavailable";
      $("happBtn").disabled = true;
    }
  }

  /* ================= TABS ================= */
  const TABS = [
    { btn: "tabProxy",   pane: "proxyTab" },
    { btn: "tabUpdates", pane: "updatesTab" },
    { btn: "tabInfo",    pane: "infoTab" }
  ];
  function selectTab(activeBtn) {
    TABS.forEach(t => {
      const on = (t.btn === activeBtn);
      $(t.btn).classList.toggle("on", on);
      $(t.pane).classList.toggle("hidden", !on);
    });
    if (activeBtn === "tabUpdates") loadUpdates();
  }

  /* ================= FEATURES ================= */
  const FEATURES = [
    "Game traffic routed through the proxy",
    "Event and CDN hosts kept direct",
    "UDP + TCP game ports forwarded",
    "Automatic profile refresh every minute",
    "Device-locked key protection"
  ];
  function paintFeatures() {
    const ul = $("featureList");
    if (ul.childElementCount) return;
    FEATURES.forEach(f => {
      const li = document.createElement("li");
      li.innerText = f;
      ul.appendChild(li);
    });
  }

  /* ================= UPDATES ================= */
  async function loadUpdates() {
    if (updatesLoaded) return;
    const ul = $("updatesList");
    try {
      const r = await fetch(UPDATES_URL, { cache: "no-store" });
      if (!r.ok) throw new Error("http " + r.status);
      const txt = (await r.text()).trim();
      const lines = txt.split(/\r?\n/).map(l => l.trim()).filter(Boolean);
      ul.innerHTML = "";
      if (!lines.length) { ul.innerHTML = "<li>No updates posted.</li>"; return; }
      lines.forEach(l => {
        const li = document.createElement("li");
        li.innerText = l;
        ul.appendChild(li);
      });
      updatesLoaded = true;
    } catch (e) {
      ul.innerHTML = "<li>Could not load updates.</li>";
    }
  }

  /* ================= WIRING ================= */
  $("unlockBtn").addEventListener("click", unlockPortal);
  $("keyInput").addEventListener("keydown", (e) => { if (e.key === "Enter") unlockPortal(); });
  $("keyInput").addEventListener("input", (e) => {
    const pos = e.target.selectionStart;
    e.target.value = String(e.target.value).toUpperCase();
    e.target.setSelectionRange(pos, pos);
  });

  $("maintRetryBtn").addEventListener("click", async () => {
    const m = await getMaintenance();
    if (m && !m.enabled) { await revalidate(); if (!activeKey && !readSession()) showUnlock(); }
    else showMaintenance(m && m.message);
  });

  TABS.forEach(t => $(t.btn).addEventListener("click", () => selectTab(t.btn)));

  $("happBtn").addEventListener("click", () => {
    if (!happLink) return;
    window.location.href = happLink;
  });
  $("copySubBtn").addEventListener("click", () => copyText(rawSubUrl, "Sub link copied"));
  $("copyKeyBtn").addEventListener("click", () => copyText(activeKey, "Key copied"));
  $("refreshBtn").addEventListener("click", revalidate);
  $("logoutBtn").addEventListener("click", logout);

  $("tgLink").href = TELEGRAM_URL;
  $("displaySupport").innerText = TELEGRAM_URL.replace("https://", "");

  document.addEventListener("visibilitychange", () => {
    if (!document.hidden && readSession()) revalidate();
  });
  setInterval(revalidate, 60000);

  /* ================= BOOT ================= */
  (async function boot() {
    paintFeatures();
    const m = await getMaintenance();
    if (m && m.enabled) {
      const restored = await restoreSession();
      if (!restored) showMaintenance(m.message);
      return;
    }
    const restored = await restoreSession();
    if (!restored) showUnlock();
  })();
})();
</script>
</body>
</html>
